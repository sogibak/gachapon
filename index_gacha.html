<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#20a8df">
<title>Design GachaPon!</title>
<style>
:root {
  color-scheme: light;
  font-family: Arial, Helvetica, sans-serif;
  background: #20a8df;
}

* { box-sizing: border-box; }

html, body { margin: 0; min-height: 100%; }

body {
  min-height: 100vh;
  overflow-x: hidden;
  background: #20a8df;
}

.stage {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 0;
  overflow: hidden;
  background-color: #20a8df;
  background-image:
    radial-gradient(circle at 12% 19%, rgba(255,255,255,.24) 0 0.7px, transparent .9px),
    radial-gradient(circle at 70% 66%, rgba(0,74,160,.15) 0 0.8px, transparent 1px),
    radial-gradient(circle at 47% 42%, rgba(255,255,255,.16) 0 0.55px, transparent .85px),
    linear-gradient(135deg, rgba(255,255,255,.04), rgba(0,64,190,.06));
  background-size: 7px 7px, 9px 9px, 5px 5px, 100% 100%;
}

.artboard {
  position: relative;
  width: min(100vw, calc(100vh * 1.42));
  aspect-ratio: 1.42 / 1;
  overflow: visible;
  background-color: #20a8df;
  background-image:
    radial-gradient(circle at 12% 19%, rgba(255,255,255,.24) 0 0.7px, transparent .9px),
    radial-gradient(circle at 70% 66%, rgba(0,74,160,.15) 0 0.8px, transparent 1px),
    radial-gradient(circle at 47% 42%, rgba(255,255,255,.16) 0 0.55px, transparent .85px),
    linear-gradient(135deg, rgba(255,255,255,.04), rgba(0,64,190,.06));
  background-size: 7px 7px, 9px 9px, 5px 5px, 100% 100%;
}

.hotspot {
  position: absolute;
  display: block;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  line-height: 0;
  transform-origin: center;
  transition: filter .18s ease, transform .18s ease;
  z-index: 2;
}

.hotspot img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.hotspot:hover, .hotspot:focus-visible { filter: drop-shadow(0 0 5px rgba(255,255,255,.95)); transform: scale(1.035); outline: none; }
.hotspot.selected { filter: drop-shadow(0 0 7px #fff) drop-shadow(0 0 12px rgba(244, 35, 43, .9)); }

.item-1 { left: 5.5%; top: 3.2%; width: 22%; height: 28%; }
.item-2 { left: 28.5%; top: 4.8%; width: 15.5%; height: 19%; }
.item-3 { left: 5.4%; top: 33.5%; width: 13.5%; height: 19%; }
.item-4 { left: 63%; top: 5.2%; width: 20.5%; height: 22.5%; }
.item-5 { left: 84.5%; top: 6%; width: 11.5%; height: 18.5%; }
.item-6 { left: 79%; top: 45%; width: 15.5%; height: 18%; }

.logo {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 48%;
  width: 34%;
  margin: 0;
  transform: translate(-50%, -50%);
  height: auto;
  pointer-events: none;
}

.hand {
  position: absolute;
  z-index: 4;
  pointer-events: none;
  width: 26%;
  height: auto;
  left: var(--hand-left, 39.7%);
  top: var(--hand-top, 37.5%);
  will-change: left, top;
}

.randomizer {
  position: absolute;
  z-index: 2;
  width: 9.5%;
  height: 31%;
  left: 5.8%;
  bottom: 4.2%;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.dice {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  transition: transform .18s ease, filter .18s ease;
}

.randomizer:hover .dice,
.randomizer:focus-visible .dice {
  transform: rotate(-6deg) scale(1.06);
  filter: drop-shadow(0 0 6px rgba(255,255,255,.9));
}

.random-label {
  position: absolute;
  left: 82%;
  top: 8%;
  padding: 5px 9px;
  border-radius: 999px;
  color: #fff;
  background: #ed2028;
  font-size: clamp(12px, 1.45vw, 16px);
  font-weight: 800;
  white-space: nowrap;
  opacity: 0;
  transform: translateY(5px) scale(.92);
  transition: opacity .16s ease, transform .16s ease;
  pointer-events: none;
  box-shadow: 2px 2px 0 rgba(0, 67, 154, .32);
}

.randomizer:hover .random-label,
.randomizer:focus-visible .random-label {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.selection {
  position: fixed;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  margin: 0;
  padding: 6px 12px;
  border-radius: 999px;
  color: rgba(255,255,255,.9);
  background: rgba(0, 60, 130, .27);
  font-size: 13px;
  letter-spacing: .02em;
  pointer-events: none;
}

@media (max-aspect-ratio: 1.42/1) {
  .stage { align-items: start; }
  .artboard { width: 100vw; margin-top: 0; }
}

:root { font-family: Arial, Helvetica, sans-serif; background: #20a8df; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { min-height: 100vh; background: #20a8df; }
.detail-stage {
  min-height: 100vh;
  display: grid;
  place-items: center;
  position: relative;
  padding: 48px 24px;
  background-image: radial-gradient(circle at 14% 20%, rgba(255,255,255,.22) 0 1px, transparent 1.2px), radial-gradient(circle at 75% 65%, rgba(0,74,160,.16) 0 1px, transparent 1.2px);
  background-size: 8px 8px, 10px 10px;
}
.corner-art { position: fixed; right: 22px; bottom: 18px; z-index: 3; width: min(24vw, 240px); height: auto; pointer-events: none; }
.back {
  position: fixed;
  top: 20px;
  left: 22px;
  width: min(30vw, 240px);
  line-height: 0;
  text-decoration: none;
  transition: transform .18s ease, filter .18s ease;
}
.back img { display: block; width: 100%; height: auto; }
.back:hover, .back:focus-visible { transform: scale(1.04); filter: drop-shadow(0 0 6px rgba(255,255,255,.8)); outline: none; }
.detail-card { margin: 0; display: grid; justify-items: center; gap: 18px; max-width: 96vw; max-height: 92vh; }
.detail-image-button { display: block; padding: 0; border: 0; background: transparent; cursor: pointer; perspective: 900px; transition: transform .18s ease; }
.detail-image-button:hover, .detail-image-button:focus-visible { transform: scale(1.035); outline: none; }
.detail-image-button img { display: block; max-width: 94vw; max-height: 90vh; width: auto; height: auto; object-fit: contain; }
.detail-image-button:hover img, .detail-image-button:focus-visible img { outline: none; }
.detail-image-button.spinning img { animation: spin-image .72s cubic-bezier(.25,.75,.35,1); }
.result-overlay { position: fixed; inset: 0; z-index: 10; display: grid; grid-template-columns: 1fr 0fr; place-items: center; overflow: hidden; background: rgba(9, 67, 125, .48); opacity: 0; pointer-events: none; transition: grid-template-columns .45s ease; }
.result-overlay.visible { opacity: 1; }
.result-overlay.visible { pointer-events: auto; }
.result-copy { width: min(94vw, 1200px); padding: 8vh 4vw; text-align: center; transform: translateY(100vh); cursor: pointer; outline: none; }
.result-overlay.visible .result-copy { animation: result-rise .95s ease-out forwards; }
.word-result { margin: 0; color: #fff; font-size: clamp(58px, 15vw, 190px); font-weight: 900; line-height: 1.05; letter-spacing: -.08em; white-space: nowrap; }
.word-definition { max-width: 900px; margin: 28px auto 0; color: rgba(255,255,255,.94); font-size: clamp(18px, 3vw, 34px); line-height: 1.4; }
.notepad { width: 100%; height: min(74vh, 680px); padding: 28px; border: 3px solid #183b66; border-radius: 10px; background: #fffdf1; box-shadow: 8px 10px 0 rgba(0, 34, 82, .25); opacity: 0; transform: translateX(40px); transition: opacity .4s ease .2s, transform .4s ease .2s; pointer-events: none; }
.notepad-logo { display: block; width: min(88%, 380px); height: auto; margin: 0 auto 48px; }
.notepad textarea { display: block; width: 100%; height: calc(100% - 96px); resize: none; border: 0; outline: 0; background: transparent; color: #183b66; font: inherit; font-size: clamp(16px, 1.8vw, 22px); line-height: 32px; }
.result-overlay.ideation-mode { grid-template-columns: 1fr 1fr; gap: 3vw; padding: 7vh 4vw; }
.result-overlay.ideation-mode { background: #20a8df; }
.result-overlay.ideation-mode .result-copy { width: 100%; padding: 4vh 2vw; transform: none; animation: none; }
.result-overlay.ideation-mode .word-result { font-size: clamp(42px, 8vw, 100px); white-space: normal; }
.result-overlay.ideation-mode .word-definition { font-size: clamp(16px, 2.1vw, 25px); }
.result-overlay.ideation-mode .notepad { border: 0; border-radius: 0; background: transparent; box-shadow: none; }
.result-overlay.ideation-mode .notepad { opacity: 1; transform: translateX(0); pointer-events: auto; }

@keyframes result-rise {
  0% { transform: translateY(100vh); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}

@keyframes spin-image {
  0% { transform: rotateY(0deg) scale(1); }
  45% { transform: rotateY(540deg) scale(1.04); }
  100% { transform: rotateY(720deg) scale(1); }
}

#detail-view[hidden], #home-view[hidden] { display: none !important; }
</style>
</head>

const status = document.querySelector('.selection');

let targetLeft = null;
let targetTop = null;
let currentLeft = null;
let currentTop = null;

function getHomePosition() {
  const bounds = artboard.getBoundingClientRect();
  return {
    left: bounds.width * 0.397,
    top: bounds.height * 0.375,
  };
}

function followPointer() {
  if (targetLeft === null || targetTop === null) {
    const home = getHomePosition();
    targetLeft = home.left;
    targetTop = home.top;
    currentLeft = home.left;
    currentTop = home.top;
  }

  currentLeft += (targetLeft - currentLeft) * 0.14;
  currentTop += (targetTop - currentTop) * 0.14;
  hand.style.setProperty('--hand-left', `${currentLeft}px`);
  hand.style.setProperty('--hand-top', `${currentTop}px`);
  requestAnimationFrame(followPointer);
}

document.addEventListener('pointermove', (event) => {
  const bounds = artboard.getBoundingClientRect();
  const handBounds = hand.getBoundingClientRect();
  const handWidth = handBounds.width;
  const handHeight = handBounds.height;
  const pointerX = event.clientX - bounds.left;
  const pointerY = event.clientY - bounds.top;

  // The fingertip sits near the center of the asset's top edge.
  targetLeft = pointerX - handWidth * 0.5;
  targetTop = pointerY - handHeight * 0.035;
});

window.addEventListener('blur', () => {
  const home = getHomePosition();
  targetLeft = home.left;
  targetTop = home.top;
});

followPointer();

hotspots.forEach((hotspot) => {
  hotspot.addEventListener('click', () => {
    window.location.hash = `item=${hotspot.dataset.item}`;
  });
});

  const randomItem = Math.floor(Math.random() * hotspots.length) + 1;
  window.location.hash = `item=${randomItem}`;
});
